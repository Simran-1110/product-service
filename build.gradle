plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.18'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
	id 'com.google.protobuf' version '0.8.18'
	id 'pmd'
	id 'checkstyle'
}

group = 'com.nuclei'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	grpcVersion = '1.45.1' // compatible with net.devh 2.13.x-2.15.x
	protobufJavaVersion = '3.25.3'
	mapstructVersion = '1.5.5.Final'
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufJavaVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all().each { task ->
			task.builtins {
				java {}
			}
			task.plugins {
				grpc {}
			}
		}
	}
}

sourceSets {
	main {
		proto {
			srcDir 'proto/src/main/proto'
		}
		java {
			srcDirs += 'build/generated/source/proto/main/java'
			srcDirs += 'build/generated/source/proto/main/grpc'
		}
	}
}

dependencies {
	// Spring + JPA + Web
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Micrometer Prometheus
	implementation 'io.micrometer:micrometer-core'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// gRPC + Protobuf runtime
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "com.google.protobuf:protobuf-java:${protobufJavaVersion}"

	// Spring Boot gRPC integration
	implementation "net.devh:grpc-spring-boot-starter:2.15.0.RELEASE"

	// MapStruct
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// JDBC driver (only one declaration needed)
	runtimeOnly 'mysql:mysql-connector-java:8.0.33'

	// Logging (explicit SLF4J, but Boot already includes logback)
	implementation 'org.slf4j:slf4j-api:1.7.36'
	implementation 'ch.qos.logback:logback-classic:1.2.12'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mockito:mockito-core:5.3.1'
	testImplementation 'org.assertj:assertj-core:3.24.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'com.h2database:h2'
}

configurations.all {
	resolutionStrategy {
		force "io.grpc:grpc-netty-shaded:${grpcVersion}"
		force "io.grpc:grpc-protobuf:${grpcVersion}"
		force "io.grpc:grpc-stub:${grpcVersion}"
		force "io.grpc:grpc-core:${grpcVersion}"
		force 'ch.qos.logback:logback-classic:1.2.12'
		force 'ch.qos.logback:logback-core:1.2.12'
	}
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-parameters']
}

// Checkstyle
apply plugin: 'checkstyle'
checkstyle {
	toolVersion '8.11'
	sourceSets = [project.sourceSets.main]
}
tasks.withType(Checkstyle) {
	showViolations true
	exclude '**/mock/**/*'
	doLast {
		reports.all { report ->
			def outputFile = report.destination
			if (outputFile.exists() && outputFile.text.contains("<error ")) {
				throw new GradleException("There were checkstyle warnings! For more info check $outputFile")
			}
		}
	}
}

// PMD
apply plugin: 'pmd'
pmd {
	toolVersion = '6.26.0'
	ruleSets = []
	ruleSetFiles = files("$rootDir/config/pmd/ruleset.xml")
}

tasks.named('test') {
	useJUnitPlatform()
}
